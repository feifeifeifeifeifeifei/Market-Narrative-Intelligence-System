<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880" role="img" aria-labelledby="title desc">
  <title id="title">Technical route flowchart</title>
  <desc id="desc">A flowchart showing how raw posts become cleaned events, narrative labels, and a vector index offline, then at query time are retrieved, density-clustered into narratives with noise flagged, joined to the local event table, and summarized into reports.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
      .lane-title { font: 700 22px Arial, sans-serif; fill: #111827; }
      .lane-note { font: 400 14px Arial, sans-serif; fill: #5b6472; }
      .box { stroke-width: 1.8; rx: 14; filter: url(#shadow); }
      .box-ingest { fill: #eef7ff; stroke: #6aa8d8; }
      .box-structure { fill: #f1f8f0; stroke: #7ab77b; }
      .box-vector { fill: #fff5e8; stroke: #d99b48; }
      .box-query { fill: #f4f0ff; stroke: #9a83d7; }
      .box-cluster { fill: #e7fbf5; stroke: #35b79c; }
      .box-output { fill: #fff2f5; stroke: #d56b83; }
      .step { font: 700 18px Arial, sans-serif; fill: #111827; }
      .data-label { font: 700 13px Arial, sans-serif; fill: #374151; }
      .data { font: 400 14px Arial, sans-serif; fill: #4b5563; }
      .connector { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .connector-soft { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .chip-text { font: 700 13px Arial, sans-serif; fill: #344054; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1480" height="880"/>

  <text x="54" y="58" style="font: 700 32px Arial, sans-serif; fill: #111827;">Technical Route</text>
  <text x="54" y="86" style="font: 400 16px Arial, sans-serif; fill: #5b6472;">Local structured analytics and vector search work together through a shared event id.</text>

  <rect class="lane" x="48" y="125" width="1384" height="235" rx="18"/>
  <text class="lane-title" x="74" y="160">Offline data preparation</text>
  <text class="lane-note" x="74" y="184">Build a clean, auditable event dataset and a vector index before any query.</text>

  <rect class="lane" x="48" y="405" width="1384" height="260" rx="18"/>
  <text class="lane-title" x="74" y="440">Query-time analysis</text>
  <text class="lane-note" x="74" y="464">Retrieve similar posts, cluster them into narratives (dropping noise), then join locally to calculate the market reaction.</text>

  <!-- Offline lane: 4 steps aligned to query columns, vector DB store in the 5th column -->
  <rect class="box box-ingest" x="78" y="215" width="236" height="105" rx="14"/>
  <text class="step" x="102" y="245">1. Clean raw posts</text>
  <text class="data-label" x="102" y="273">Data produced</text>
  <text class="data" x="102" y="295">clean text, dates, ids,</text>
  <text class="data" x="102" y="315">engagement, daily returns</text>

  <rect class="box box-structure" x="350" y="215" width="236" height="105" rx="14"/>
  <text class="step" x="374" y="245">2. Classify narratives</text>
  <text class="data-label" x="374" y="273">Data produced</text>
  <text class="data" x="374" y="295">topic, tone, entities,</text>
  <text class="data" x="374" y="315">relevance, policy direction</text>

  <rect class="box box-structure" x="622" y="215" width="236" height="105" rx="14"/>
  <text class="step" x="646" y="245">3. Map assets</text>
  <text class="data-label" x="646" y="273">Data produced</text>
  <text class="data" x="646" y="295">selected tickers and</text>
  <text class="data" x="646" y="315">return fields to compare</text>

  <rect class="box box-vector" x="894" y="215" width="236" height="105" rx="14"/>
  <text class="step" x="918" y="245">4. Build vector index</text>
  <text class="data-label" x="918" y="273">Data produced</text>
  <text class="data" x="918" y="295">text embeddings with ids,</text>
  <text class="data" x="918" y="315">labels, and metadata</text>

  <path class="connector" d="M 314 268 L 347 268"/>
  <path class="connector" d="M 586 268 L 619 268"/>
  <path class="connector" d="M 858 268 L 891 268"/>

  <rect class="chip" x="1249" y="239" width="70" height="58" rx="12"/>
  <text class="chip-text" x="1268" y="263">Vector</text>
  <text class="chip-text" x="1267" y="283">DB</text>
  <path class="connector" d="M 1130 268 L 1246 268"/>

  <!-- Local event table (classified parquet) feeding the join -->
  <rect class="chip" x="663" y="372" width="154" height="38" rx="12"/>
  <text class="chip-text" x="685" y="396">Local event table</text>
  <path class="connector-soft" d="M 740 320 L 740 369"/>

  <!-- Query lane: 5 steps -->
  <rect class="box box-query" x="78" y="500" width="236" height="105" rx="14"/>
  <text class="step" x="102" y="530">5. Ask a question</text>
  <text class="data-label" x="102" y="558">Data produced</text>
  <text class="data" x="102" y="580">validated, redacted</text>
  <text class="data" x="102" y="600">search query</text>

  <rect class="box box-vector" x="350" y="500" width="236" height="105" rx="14"/>
  <text class="step" x="374" y="530">6. Retrieve matches</text>
  <text class="data-label" x="374" y="558">Data produced</text>
  <text class="data" x="374" y="580">similar event ids and</text>
  <text class="data" x="374" y="600">similarity scores</text>

  <rect class="box box-cluster" x="622" y="500" width="236" height="105" rx="14"/>
  <text class="step" x="646" y="530">7. Cluster narratives</text>
  <text class="data-label" x="646" y="558">Data produced (DBSCAN)</text>
  <text class="data" x="646" y="580">narrative groups and</text>
  <text class="data" x="646" y="600">per-post noise flags</text>

  <rect class="box box-ingest" x="894" y="500" width="236" height="105" rx="14"/>
  <text class="step" x="918" y="530">8. Join locally</text>
  <text class="data-label" x="918" y="558">Data produced</text>
  <text class="data" x="918" y="580">non-noise posts with</text>
  <text class="data" x="918" y="600">labels and selected returns</text>

  <rect class="box box-output" x="1166" y="500" width="236" height="105" rx="14"/>
  <text class="step" x="1190" y="530">9. Generate output</text>
  <text class="data-label" x="1190" y="558">Data produced</text>
  <text class="data" x="1190" y="580">summary, narratives,</text>
  <text class="data" x="1190" y="600">tables, charts, data</text>

  <path class="connector" d="M 314 553 L 347 553"/>
  <path class="connector" d="M 586 553 L 619 553"/>
  <path class="connector" d="M 858 553 L 891 553"/>
  <path class="connector" d="M 1130 553 L 1163 553"/>

  <!-- Vector DB feeds retrieval; local event table feeds the join -->
  <path class="connector-soft" d="M 1284 297 C 1284 430, 470 432, 468 498"/>
  <path class="connector-soft" d="M 740 410 C 740 455, 1012 452, 1012 498"/>

  <rect x="230" y="708" width="1020" height="90" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="266" y="741" style="font: 700 16px Arial, sans-serif; fill: #374151;">Result</text>
  <text x="340" y="741" style="font: 400 15px Arial, sans-serif; fill: #5b6472;">Vector search finds similar events; density clustering groups them into narratives and drops off-topic noise;</text>
  <text x="340" y="766" style="font: 400 15px Arial, sans-serif; fill: #5b6472;">the local analytical database explains the market context of the clean set: matched posts, ticker returns, summaries, charts.</text>
</svg>
